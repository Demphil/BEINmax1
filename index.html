<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; display: flex; flex-direction: column; }
        
        /* المشغل يأخذ كل المساحة المتاحة ما عدا مساحة الإعلان */
        #video { width: 100%; flex-grow: 1; background: #000; }
        
        /* الشريط السفلي للإعلانات */
        .ad-container { 
            width: 100%; 
            height: 60px; /* مساحة ثابتة للإعلان */
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- مشغل الفيديو -->
    <video id="video" controls autoplay muted></video>

    <!-- حاوية الإعلان -->
    <div class="ad-container">
        <script>
            atOptions = {
                'key' : '10c5b600c97b594e544f498f9b4770d0',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script src="https://behavecurlescalator.com/10c5b600c97b594e544f498f9b4770d0/invoke.js"></script>
    </div>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://s3.us-east-2.amazonaws.com/cdnx100/live/stream/index.m3u8';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
        }
    </script>
      <script src="ad-manager.js"></script>
</body>
</html>

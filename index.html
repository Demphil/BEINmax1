<!-- استدعاء مكتبة Hls.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- 1. مشغل البث المباشر (HLS) -->
<video id="video" controls style="width: 100%; max-width: 800px; background: #000;"></video>

<!-- 2. مساحة تضمين رابط Cloudflare Worker -->
<div style="margin-top: 20px; width: 100%; max-width: 800px;">
    <iframe 
        src="https://withered-mud-4e52.koora-live.workers.dev" 
        style="width: 100%; height: 400px; border: 1px solid #ccc;" 
        allowfullscreen>
    </iframe>
</div>

<script>
  var video = document.getElementById('video');
  var videoSrc = 'https://s3.us-east-2.amazonaws.com/cdnx100/live/stream/index.m3u8';

  // تشغيل البث المباشر في المشغل الأول
  if (Hls.isSupported()) {
    var hls = new Hls();
    hls.loadSource(videoSrc);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = videoSrc;
  }
</script>

<script src="ad-manager.js"></script>

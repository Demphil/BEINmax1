<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- 1. استدعاء مكتبة Hls.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- 2. عنصر الفيديو -->
<video id="video" controls style="width: 100%; max-width: 800px;"></video>

<script>
  var video = document.getElementById('video');
  var videoSrc = 'https://s3.us-east-2.amazonaws.com/cdnx100/live/stream/index.m3u8';

  // 3. التحقق من دعم المتصفح
  if (Hls.isSupported()) {
    var hls = new Hls();
    hls.loadSource(videoSrc);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play();
    });
  }
  // 4. دعم متصفحات Safari و iOS (التي تدعم HLS أصلياً)
  else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = videoSrc;
    video.addEventListener('loadedmetadata', function() {
      video.play();
    });
  }
</script>

<script src="ad-manager.js"></script>


</body>   
</html>

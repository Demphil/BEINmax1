<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; }
        /* مشغل الفيديو يأخذ المساحة الرئيسية */
        #video { width: 100%; height: 80vh; background: #000; }
        /* رابط Cloudflare يظهر أسفل الفيديو */
        iframe { width: 100%; height: 20vh; border: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- مشغل الفيديو -->
    <video id="video" controls autoplay muted></video>

    <!-- رابط Cloudflare -->
    <iframe src="https://withered-mud-4e52.koora-live.workers.dev"></iframe>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://s3.us-east-2.amazonaws.com/cdnx100/live/stream/index.m3u8';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
        }
    </script>
     <script src="ad-manager.js"></script>
</body>
</html>
